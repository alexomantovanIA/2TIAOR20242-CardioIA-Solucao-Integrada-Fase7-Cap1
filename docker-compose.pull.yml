# Stack usando imagem já publicada (sem build local do CardioIA).
# Exemplo (GHCR após o workflow publicar):
#   $env:CARDIOIA_IMAGE = "ghcr.io/joseandrefilho/2tiaor20242-cardioia-fase6-cap1:latest"
#   docker compose -f docker-compose.pull.yml --env-file .env up
#
# O nome da imagem no GHCR é sempre minúsculo: dono/repo em minúsculas.

services:
  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEBUG: "0"
      LS_LOG: warn
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    image: ${CARDIOIA_IMAGE}
    pull_policy: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PORT: "5000"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      CARDIOIA_S3_LOG_BUCKET: cardioia-logs
    depends_on:
      localstack:
        condition: service_healthy
    command: ["sh", "-c", "python scripts/init_localstack_s3.py && python -m backend.app"]
    volumes:
      - ./agents/logs:/app/agents/logs
